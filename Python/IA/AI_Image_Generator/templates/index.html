<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
</head>
<body>
    <h1>Générateur d'images avec IA</h1>
    <form action="/generate" method="post">
        <label for="prompt">Description de l'image :</label><br>
        <input type="text" id="prompt" name="prompt" required><br><br>

        <label for="style">Style artistique :</label><br>
        <select id="style" name="style">
            <option value="realistic">Réaliste</option>
            <option value="oil painting">Peinture à l'huile</option>
            <option value="cartoon">Cartoon</option>
            <option value="fantasy">Fantastique</option>
        </select><br><br>


        <label for="resolution">Résolution :</label><br>
        <select id="resolution" name="resolution">
            <option value="512">512x512</option>
            <option value="768">768x768</option>
        </select><br><br>

        <label for="num_images">Nombre d'images :</label><br>
        <input type="number" id="num_images" name="num_images" value="1" min="1" max="5"><br><br>

        <button type="submit">Générer</button>
    </form>
</body>
</html>

<div id="progress-container" style="display: none;">
    <p>Progression : <span id="progress-value">0</span>%</p>
    <progress id="progress-bar" value="0" max="100"></progress>
</div>

<script>
    function checkProgress() {
        fetch("/progress")
            .then(response => response.json())
            .then(data => {
                const progress = data.progress;
                document.getElementById("progress-value").textContent = progress;
                document.getElementById("progress-bar").value = progress;

                if (progress < 100) {
                    setTimeout(checkProgress, 500);  // Refaire la requête toutes les 500ms
                }
            });
    }

    // Afficher la barre de progression dès l'envoi du formulaire
    document.querySelector("form").addEventListener("submit", function() {
        document.getElementById("progress-container").style.display = "block";
        checkProgress();
    });
</script>
