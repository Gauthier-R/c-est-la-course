<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat</title>
</head>
<body>
    <h1>Voici vos images générées :</h1>
    {% for image_path in image_paths %}
        <div>
            <img src="{{ url_for('static', filename=image_path) }}" alt="Image générée" style="width: 512px; height: auto;"><br>
            <a href="{{ url_for('static', filename=image_path) }}" download>Télécharger cette image</a><br><br>
        </div>
    {% endfor %}
    <a href="/">Retour</a>
</body>
</html>
