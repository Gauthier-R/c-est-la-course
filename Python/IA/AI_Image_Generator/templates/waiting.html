<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génération en cours...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
</head>
<body>
    <h1>Génération en cours...</h1>
    <div id="progress-container">
        <p>Progression : <span id="progress-value">0</span>%</p>
        <progress id="progress-bar" value="0" max="100"></progress>
    </div>

    <script>
        const socket = io.connect('http://127.0.0.1:5000');
    
        // Test de connexion WebSocket
        socket.emit('test_connection', {});
        socket.on('test_response', function(data) {
            console.log(data.message);  // Vérifie que la connexion fonctionne
        });
    
        const sessionId = "{{ session_id }}";
    
        // Suivre la progression
        socket.emit('track_progress', { session_id: sessionId });
        socket.on('progress_update', function(data) {
            if (data.session_id === sessionId) {
                const progress = data.progress;
                document.getElementById("progress-value").textContent = progress;
                document.getElementById("progress-bar").value = progress;
    
                if (progress === 100) {
                    window.location.href = `/result/${sessionId}`;
                }
            }
        });
    </script>
    
</body>
</html>
