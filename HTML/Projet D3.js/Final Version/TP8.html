<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fréquentation des Musées</title>
    <link rel="stylesheet" href="TP8.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <h1>Fréquentation des Musées</h1>
        <nav>
            <ul>
                <li><a href="#" onclick="showPage('upload')">Importer les Données</a></li>
                <li><a href="#" onclick="showPage('dashboard')">Indicateurs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Page d'importation -->
        <section id="upload" class="page">
            <h2>Importer un fichier CSV</h2>
            <form id="upload-form">
                <input type="file" id="csv-file" accept=".csv">
                <button type="button" onclick="processCSV()">Convertir en JSON</button>
            </form>
            <div id="json-output-container">
                <pre id="json-output"></pre>
            </div>
            <div id="data-table-container">
                <table id="data-table"></table>
            </div>
        </section>

        <!-- Page des indicateurs -->
        <section id="dashboard" class="page hidden">
            <h2>Indicateurs</h2>

            <!-- Filtres -->
            <div id="filters">
                <label for="year">Année:</label>
                <select id="year" onchange="updateCharts()"></select>
                <label for="region">Région:</label>
                <div id="region" class="checkbox-group" onchange="updateCharts()"></div>
            </div>

            <!-- Graphiques -->
            <div id="charts">
                <div id="bar-chart" class="chart"></div>
                <div id="pie-chart" class="chart"></div>
                <div id="line-chart" class="chart"></div>
            </div>
        </section>
    </main>

    <script>
        let jsonData = [];

        // Gestion des pages
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.add('hidden');
            });
            const page = document.getElementById(pageId);
            if (page) {
                page.classList.remove('hidden');
            }
        }

        // Conversion CSV en JSON
        function processCSV() {
            const fileInput = document.getElementById('csv-file');
            const output = document.getElementById('json-output');

            if (!fileInput.files.length) {
                alert('Veuillez sélectionner un fichier CSV.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const csvData = event.target.result;
                const rows = csvData.split('\n').filter(row => row.trim());
                const headers = rows[0].split(';').map(h => h.trim());
                jsonData = rows.slice(1).map(row => {
                    const values = row.split(';').map(v => v.trim());
                    return headers.reduce((acc, header, index) => {
                        acc[header] = values[index] || null;
                        return acc;
                    }, {});
                });

                output.textContent = JSON.stringify(jsonData, null, 2);
                initializeDashboard(jsonData);
                populateDataTable(jsonData);
            };

            reader.readAsText(file);
        }

        // Initialisation du tableau de bord avec les graphiques
        function initializeDashboard(data) {
            populateFilters(data);
            updateCharts();
        }

        // Remplir les filtres dynamiquement
        function populateFilters(data) {
            const years = [...new Set(data.map(item => item['ANNEE']))].sort((a, b) => a - b);
            const regions = [...new Set(data.map(item => item['REGION']))]
                .filter(region => region && region === region.toUpperCase())
                .sort();

            // Remove the first value
            years.shift();

            populateSelect('year', years);
            populateCheckboxGroup('region', regions);

            // Set default year to the smallest year in the list
            document.getElementById('year').value = years[0];
            updateCharts(); // Ensure charts are updated with the default year
        }

        function populateSelect(id, options) {
            const select = document.getElementById(id);
            select.innerHTML = '';
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });
        }

        function populateCheckboxGroup(id, options) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            options.forEach(option => {
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = option;
                checkbox.checked = true;
                checkbox.onchange = updateCharts; // Ensure charts are updated when checkbox state changes
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(option));
                container.appendChild(label);
            });
        }

        // Mise à jour des graphiques en fonction des filtres
        function updateCharts() {
            const year = document.getElementById('year').value;
            const selectedRegions = Array.from(document.querySelectorAll('#region input:checked')).map(input => input.value);

            const filteredData = jsonData.filter(item => item['ANNEE'] === year && selectedRegions.includes(item['REGION']));

            generateBarChart(filteredData);
            generatePieChart(filteredData);
            generateLineChart(filteredData);
        }

        // Graphique des 10 musées les plus fréquentés
        function generateBarChart(data) {
            // Calculer les 10 musées avec les valeurs 'TOTAL' les plus élevées
            const topMuseums = data
                .sort((a, b) => b['TOTAL'] - a['TOTAL'])
                .slice(0, 10);

            const museums = topMuseums.map(d => d['NOM DU MUSEE']);
            const totals = topMuseums.map(d => +d['TOTAL']);

            const width = 1400;
            const barHeight = 30;
            const margin = 1;
            const labelWidth = 600;

            const scale = d3.scaleLinear()
                .domain([0, d3.max(totals)])
                .range([0, width - labelWidth - 20]);

            const colorScale = d3.scaleLinear()
                .domain([0, topMuseums.length - 1])
                .range(["#8B0000", "#FF6347"]); // Dégradé de rouge du plus foncé au plus clair

            const barChartContainer = d3.select("#bar-chart").html('')
                .append("div")
                .style("overflow-x", "auto")
                .style("width", "100%");

            const barChart = barChartContainer.append("svg")
                .attr("width", width)
                .attr("height", barHeight * totals.length + 40)
                .style('background-color', 'white');

            // Titre
            barChart.append("text")
                .attr("x", width / 2)
                .attr("y", 20)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .style("font-weight", "bold")
                .text("Top 10 des musées les plus visités en France");

            const barg = barChart.selectAll("g")
                .data(totals)
                .enter()
                .append("g")
                .attr("transform", (d, i) => `translate(0,${i * barHeight + 40})`);

            barg.append("rect")
                .attr("x", labelWidth)
                .attr("width", d => scale(d))
                .attr("height", barHeight - margin)
                .style('fill', (d, i) => colorScale(i));

            barg.append("text")
                .attr("x", labelWidth - 5)
                .attr("y", barHeight / 2)
                .attr("dy", ".35em")
                .attr("text-anchor", "end")
                .style("font-size", d => Math.min(14, (barHeight - margin) / 1.5) + "px")
                .style("fill", "black")
                .text((d, i) => museums[i]);

            barg.append("text")
                .attr("x", d => labelWidth + scale(d) - 5)
                .attr("y", barHeight / 2)
                .attr("dy", ".35em")
                .attr("text-anchor", "end")
                .style("font-size", d => Math.min(14, (barHeight - margin) / 1.5) + "px")
                .style("fill", "white")
                .text(d => d);
        }

        // Graphique secteurs (nb musées par région)
        function countCategorie(data, property) {
            const frequency = {};

            data.forEach(item => {
                const value = item[property];
                if (frequency[value]) {
                    frequency[value]++;
                } else {
                    frequency[value] = 1;
                }
            });

            return Object.keys(frequency).map(key => ({
                Categorie_centrale: key,
                nombre: frequency[key]
            }));
        }

        function generatePieChart(data) {
            const dataCategory = countCategorie(data, "REGION");

            // Clear existing chart
            d3.select("#pie-chart").html('');

            var svg = d3.select("#pie-chart").append("svg")
                .attr("width", 1000)
                .attr("height", 500)
                .style('background-color', 'white');

            // Add title
            svg.append("text")
                .attr("x", 500)
                .attr("y", 30)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .style("font-weight", "bold")
                .text("Nombre de musées par région Française");

            var base_diagramme = d3.pie().value(function(d) { return d.nombre; })(dataCategory);
            var arc = d3.arc().innerRadius(0).outerRadius(200).padAngle(0.05).padRadius(50);
            var couleur = d3.scaleOrdinal(d3.schemeCategory10.concat(d3.schemeSet3));

            var sections = svg.append("g")
                .attr("transform", "translate(300,250)")
                .selectAll("path")
                .data(base_diagramme)
                .enter().append("path")
                .attr("d", arc)
                .attr("fill", function(d) { return couleur(d.data.Categorie_centrale); });

            var libelle = svg.select("g").selectAll("text")
                .data(base_diagramme)
                .enter()
                .append("text")
                .classed("inside", true)
                .attr("transform", function(d) {
                    var pos = arc.centroid(d);
                    return "translate(" + pos + ")";
                })
                .attr("dy", ".35em")
                .style("text-anchor", "middle")
                .text(function(d) {
                    return d.data.nombre;
                });

            // Add legend
            var legend = svg.append("g")
                .attr("transform", "translate(600, 100)")
                .selectAll("g")
                .data(base_diagramme)
                .enter().append("g")
                .attr("transform", function(d, i) { return "translate(0," + i * 20 + ")"; });

            legend.append("rect")
                .attr("width", 18)
                .attr("height", 18)
                .attr("fill", function(d) { return couleur(d.data.Categorie_centrale); });

            legend.append("text")
                .attr("x", 24)
                .attr("y", 9)
                .attr("dy", ".35em")
                .text(function(d) { return d.data.Categorie_centrale; });
        }

        // Graphique de l'évolution des visiteurs payants et gratuits
        function generateLineChart(data) {
            const groupedData = d3.groups(jsonData, d => d['ANNEE']);
            const years = groupedData.map(([year, entries]) => {
                return {
                    year,
                    gratuit: entries.filter(d => d['TYPE_ACCESSIBILITE'] === 'GRATUIT').length,
                    payant: entries.filter(d => d['TYPE_ACCESSIBILITE'] === 'PAYANT').length,
                    mixte: entries.filter(d => d['TYPE_ACCESSIBILITE'] === 'MIXTE').length
                };
            }).sort((a, b) => a.year - b.year);

            // Remove the first value
            years.shift();

            const svgWidth = 2000;
            const svgHeight = 520;
            const margin = { top: 40, right: 20, bottom: 50, left: 50 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            const svg = d3.select('#line-chart').html('')
                .append('div')
                .style('overflow-x', 'auto')
                .style('width', '100%')
                .append('svg')
                .attr('width', svgWidth)
                .attr('height', svgHeight)
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Ajouter le titre
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -10)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .style("font-weight", "bold")
                .text("Évolution de l'accessibilité des musées en France par an");

            const x = d3.scaleBand()
                .domain(years.map(d => d.year))
                .range([0, width])
                .padding(0.2);

            const y = d3.scaleLinear()
                .domain([0, d3.max(years, d => Math.max(d.gratuit, d.payant, d.mixte))])
                .nice()
                .range([height, 0]);

            svg.append('g')
                .attr('transform', `translate(0,${height})`)
                .call(d3.axisBottom(x));

            svg.append('g')
                .call(d3.axisLeft(y));

            const barWidth = x.bandwidth() / 3;

            svg.selectAll('.bar-gratuit')
                .data(years)
                .enter().append('rect')
                .attr('class', 'bar-gratuit')
                .attr('x', d => x(d.year))
                .attr('y', d => y(d.gratuit))
                .attr('width', barWidth)
                .attr('height', d => height - y(d.gratuit))
                .attr('fill', 'orange');

            svg.selectAll('.bar-payant')
                .data(years)
                .enter().append('rect')
                .attr('class', 'bar-payant')
                .attr('x', d => x(d.year) + barWidth)
                .attr('y', d => y(d.payant))
                .attr('width', barWidth)
                .attr('height', d => height - y(d.payant))
                .attr('fill', 'steelblue');

            svg.selectAll('.bar-mixte')
                .data(years)
                .enter().append('rect')
                .attr('class', 'bar-mixte')
                .attr('x', d => x(d.year) + 2 * barWidth)
                .attr('y', d => y(d.mixte))
                .attr('width', barWidth)
                .attr('height', d => height - y(d.mixte))
                .attr('fill', 'green');

            // Ajouter des étiquettes de valeurs pour chaque colonne
            svg.selectAll('.label-gratuit')
                .data(years)
                .enter().append('text')
                .attr('class', 'label-gratuit')
                .attr('x', d => x(d.year) + barWidth / 2)
                .attr('y', d => y(d.gratuit) - 5)
                .attr('text-anchor', 'middle')
                .text(d => d.gratuit);

            svg.selectAll('.label-payant')
                .data(years)
                .enter().append('text')
                .attr('class', 'label-payant')
                .attr('x', d => x(d.year) + barWidth * 1.5)
                .attr('y', d => y(d.payant) - 5)
                .attr('text-anchor', 'middle')
                .text(d => d.payant);

            svg.selectAll('.label-mixte')
                .data(years)
                .enter().append('text')
                .attr('class', 'label-mixte')
                .attr('x', d => x(d.year) + barWidth * 2.5)
                .attr('y', d => y(d.mixte) - 5)
                .attr('text-anchor', 'middle')
                .text(d => d.mixte);

            // Ajouter une légende
            const legend = svg.append('g')
                .attr('transform', `translate(${width - 100}, 0)`);

            legend.append('rect')
                .attr('x', 0)
                .attr('y', 0)
                .attr('width', 18)
                .attr('height', 18)
                .attr('fill', 'orange');
            legend.append('text')
                .attr('x', 24)
                .attr('y', 9)
                .attr('dy', '.35em')
                .text('Gratuit');

            legend.append('rect')
                .attr('x', 0)
                .attr('y', 20)
                .attr('width', 18)
                .attr('height', 18)
                .attr('fill', 'steelblue');
            legend.append('text')
                .attr('x', 24)
                .attr('y', 29)
                .attr('dy', '.35em')
                .text('Payant');

            legend.append('rect')
                .attr('x', 0)
                .attr('y', 40)
                .attr('width', 18)
                .attr('height', 18)
                .attr('fill', 'green');
            legend.append('text')
                .attr('x', 24)
                .attr('y', 49)
                .attr('dy', '.35em')
                .text('Mixte');
        }

        // Affichage des données JSON dans un tableau
        function populateDataTable(data) {
            const table = document.getElementById('data-table');
            table.innerHTML = '';

            const headers = Object.keys(data[0]);
            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header];
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

        // Initialisation par défaut
        document.addEventListener('DOMContentLoaded', () => {
            showPage('upload');
        });
    </script>
</body>
</html>
