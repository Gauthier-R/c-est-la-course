<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystère de Noël</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0E5E5; /* Changer la couleur de fond de la page */
            text-align: center;
            padding: 50px;
        }
        .lock-container {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }
        .lock-container input {
            width: 40px;
            height: 40px;
            font-size: 24px;
            text-align: center;
            margin: 0 5px;
        }
        .btn-validate {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: red; /* Changer la couleur du bouton en rouge */
            color: white;
            border: none;
            border-radius: 5px;
        }
        .hidden-form {
            display: none;
        }
        .lock-container input:nth-child(1),
        .lock-container input:nth-child(2) {
            background-color: #FFCCCC; /* Light red */
        }
        .lock-container input:nth-child(3),
        .lock-container input:nth-child(4) {
            background-color: #CCFFFF; /* Light blue */
        }
        .lock-container input:nth-child(5),
        .lock-container input:nth-child(6) {
            background-color: #FFFFCC; /* Light yellow */
        }
    </style>
</head>
<body>
    
    <div class="lock-container">
        <input type="number" min="0" max="9" id="digit1" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this, 'digit2')">
        <input type="number" min="0" max="9" id="digit2" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this, 'digit3')">
        <input type="number" min="0" max="9" id="digit3" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this, 'digit4')">
        <input type="number" min="0" max="9" id="digit4" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this, 'digit5')">
        <input type="number" min="0" max="9" id="digit5" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this, 'digit6')">
        <input type="number" min="0" max="9" id="digit6" value="0" onfocus="clearInput(this)" onblur="restoreInput(this)" oninput="validateInput(this)">
    </div>
    <button class="btn-validate" onclick="validateCode()">Valider le code🔒</button>
    <p id="message"></p>

    <!-- Formulaire caché pour la redirection -->
    <form id="redirectForm" class="hidden-form" action="https://sites.google.com/view/escape-game-de-noel/cadeau" method="get">
    </form>

    <script>
        function clearInput(input) {
            input.dataset.previousValue = input.value;
            input.value = '';
        }

        function restoreInput(input) {
            if (input.value === '') {
                input.value = input.dataset.previousValue;
            }
        }

        function validateInput(input, nextInputId) {
            if (input.value.length > 1) {
                input.value = input.value.slice(0, 1);
            }
            if (input.value < 0 || input.value > 9) {
                input.value = 0;
            }
            if (nextInputId && input.value !== '') {
                document.getElementById(nextInputId).focus();
            }
        }

        function validateCode() {
            const code = [
                document.getElementById('digit1').value,
                document.getElementById('digit2').value,
                document.getElementById('digit3').value,
                document.getElementById('digit4').value,
                document.getElementById('digit5').value,
                document.getElementById('digit6').value
            ].join('');
            if (code === '104721') {
                document.getElementById('redirectForm').submit();
            } else {
                const messageElement = document.getElementById('message');
                messageElement.innerText = "🔔 OH OH OH 🔔\n Dommage, ce n'est pas ça ! \nEssayez encore ! ☃️";
                messageElement.style.color = 'red';
            }
        }
    </script>
</body>
</html>
